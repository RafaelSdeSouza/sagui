name: Check pkgdown site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::xml2
            local::.
          needs: website

      - name: Build and check
        run: |
          Rscript -e 'pkgdown::build_site(new_process = FALSE)'
          Rscript tools/write_website_redirects.R docs
          Rscript tools/check_website_links.R docs
